services:
  db:
    image: mysql:8.4
    container_name: leybo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: leybo
      MYSQL_USER: leybo
      MYSQL_PASSWORD: leybo_pass
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_520_ci",
      "--innodb-buffer-pool-size=512M",
    ]
    volumes:
      - leybo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: leybo-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Закрытый staging: доступ только с локальной машины, не из сети.
      - "127.0.0.1:8081:80"
    volumes:
      # Сайт в named volume (Linux-ФС в 100+ раз быстрее Windows bind mount).
      # ОТКАТ: вернуть следующую строку и закомментировать volume-строку,
      # затем `docker compose up -d` — файлы на хосте не тронуты.
      # - ../wordpress/site:/var/www/html
      - leybo_site_data:/var/www/html
      - ./apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      WORDPRESS_DEBUG: "1"

volumes:
  leybo_db_data:
  leybo_site_data:
    name: leybo_site_data
    external: true
